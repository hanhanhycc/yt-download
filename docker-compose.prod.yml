# Production overrides for NAS / low-resource hosts.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Disables source code bind-mounts (no --reload) so the image is immutable.
# - Caps CPU/RAM per service so downloads can't starve other NAS apps.
# - Reduces Celery concurrency to 2 (tune to your NAS core count).

services:
  db:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    # Remove the source bind-mount: use the baked image
    volumes:
      - ./storage:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    volumes:
      - ./storage:/data
    # Tune --concurrency to (NAS cores - 1). 2 is safe on a 4-core NAS.
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  frontend:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
