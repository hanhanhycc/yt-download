[alembic]
script_location = alembic
# Put the project root (/app, the working dir) on sys.path so env.py can
# do `from app.config import settings` when alembic runs as a console script.
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://ytdl:ytdl@db:5432/ytdl

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
