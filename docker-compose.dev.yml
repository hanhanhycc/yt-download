# Local dev overrides. Brings back source bind-mounts + uvicorn --reload.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    volumes:
      - ./storage:/data
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    volumes:
      - ./storage:/data
      - ./backend:/app
