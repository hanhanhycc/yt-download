# Single-container deployment (Synology NAS / any Docker host).
#
# Uses the prebuilt image from GitHub Actions. On Synology Container
# Manager: create a Project, paste this file, set the env vars, deploy.
# To build locally instead of pulling, comment out `image:` and uncomment
# `build: .`.

services:
  app:
    image: ghcr.io/hanhanhycc/yt-download:latest
    # build: .
    restart: unless-stopped
    ports:
      - "8182:8000"
    environment:
      # --- change these ---
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      # Open by default (no login). Set true to require login (recommended
      # only if you expose the app to the internet).
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Set true once to (re)set the admin password from ADMIN_PASSWORD, then false.
      ADMIN_RESET_ON_BOOT: ${ADMIN_RESET_ON_BOOT:-false}
      # Public URL used to build download links — usually http://<nas-ip>:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8182}
      BOT_API_KEY: ${BOT_API_KEY:-change-me-bot-key}

      # --- optional ---
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-2}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-4096}
      # yt-dlp cookies to bypass YouTube's bot check (base64 of a cookies.txt).
      YTDLP_COOKIES_B64: ${YTDLP_COOKIES_B64:-}
    volumes:
      # Holds the SQLite DB (/data/app.db) and downloaded files (/data/downloads).
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
